# security: secret scan, dependency advisories and code scanning on every PR, on push to master and weekly.
# Gitleaks scans the commits of a PR or push; the weekly and manual runs scan the full history.
# Actions are pinned to full commit SHAs (version in the comment). `privacy-scan:allow` keeps those SHAs,
# which are not objects in this repo, out of privacy-scan's opaque-id rule.
name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 privacy-scan:allow
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9 privacy-scan:allow
        env:
          GITHUB_TOKEN: ${{ github.token }} # the automatic read-only token; lists a PR's commits
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 privacy-scan:allow
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 privacy-scan:allow
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high --omit=dev

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 privacy-scan:allow
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3 privacy-scan:allow
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3 privacy-scan:allow
